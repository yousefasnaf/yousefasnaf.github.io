<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search - josephasn.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: "Courier New", monospace;
}

#page {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px;
}

.back {
    display: inline-block;
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 8px 14px;
    margin-bottom: 25px;
}

.back:hover {
    background: white;
    color: black;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

#searchBox {
    width: 100%;
    height: 55px;
    padding: 10px 15px;
    background: black;
    color: white;
    border: 2px solid white;
    outline: none;
    font-family: "Courier New", monospace;
    font-size: 18px;
}

#searchBox:focus {
    border-color: #aaa;
}

#status {
    text-align: center;
    margin: 20px 0;
    color: #aaa;
}

#results {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.result {
    padding: 16px;
    background: #1b1b1b;
    border: 1px solid #444;
    cursor: pointer;
}

.result:hover {
    background: #292929;
    border-color: white;
}

.resultName {
    font-size: 18px;
    font-weight: bold;
}

.resultType {
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

.noResults {
    text-align: center;
    padding: 40px;
    color: #888;
}
</style>
</head>

<body>

<div id="page">

    <a href="index.html" class="back">← HOME</a>

    <h1>SEARCH</h1>

    <input
        id="searchBox"
        type="text"
        placeholder="Search anything..."
        autocomplete="off"
    >

    <div id="status">Loading...</div>

    <div id="results"></div>

</div>


<script>

// ======================================================
// SEARCH DATABASE
// ======================================================

let searchItems = [];


// ======================================================
// ADD SEARCH ITEM
// ======================================================

function addItem(name, type, url) {

    if (!name) return;

    name = name.trim();

    if (!name) return;

    searchItems.push({
        name: name,
        type: type,
        url: url
    });
}


// ======================================================
// APPS
// ======================================================

addItem(
    "YouTube",
    "App",
    "apps/ty.html"
);

addItem(
    "Scratch",
    "App",
    "apps/scrattch.html"
);


// ======================================================
// READ ?q= FROM URL
// ======================================================

const params = new URLSearchParams(window.location.search);

const urlSearch = params.get("q");

const searchBox = document.getElementById("searchBox");

if (urlSearch !== null) {

    searchBox.value = urlSearch;

}


// ======================================================
// LOAD THE MAIN PAGE IN THE BACKGROUND
// ======================================================

function loadGamesFromMainPage() {

    fetch("index.html")

        .then(function(response) {

            if (!response.ok) {
                throw new Error("Could not load index.html");
            }

            return response.text();

        })

        .then(function(html) {

            /*
                Create a temporary HTML document.

                We are NOT executing index.html.

                We are only reading the game buttons
                that are already written into the page.
            */

            const parser = new DOMParser();

            const doc = parser.parseFromString(
                html,
                "text/html"
            );


            // ==========================================
            // FIND GAME BUTTONS
            // ==========================================

            const buttons =
                doc.querySelectorAll(".ugs-btn");


            buttons.forEach(function(button) {

                const name =
                    button.textContent.trim();

                if (!name) return;


                /*
                    Get the game's onclick.

                    Your UGS buttons normally contain
                    the code that opens the game.
                */

                const onclick =
                    button.getAttribute("onclick");


                let url = null;


                /*
                    Try to find a URL inside onclick.
                */

                if (onclick) {

                    const match =
                        onclick.match(
                            /['"]([^'"]+)['"]/
                        );

                    if (match) {
                        url = match[1];
                    }

                }


                /*
                    If we cannot find a URL, still add
                    the game to search results.

                    Clicking it will try to find it
                    on the homepage.
                */

                addItem(
                    name,
                    "Game",
                    url
                );

            });


            finishLoading();

        })

        .catch(function(error) {

            console.error(error);

            document.getElementById("status").textContent =
                "Could not load games.";

            renderResults();

        });

}


// ======================================================
// FINISH LOADING
// ======================================================

function finishLoading() {

    /*
        Remove duplicates.
    */

    const unique = [];

    const seen = new Set();


    searchItems.forEach(function(item) {

        const key =
            item.type + "|" +
            item.name.toLowerCase();

        if (!seen.has(key)) {

            seen.add(key);

            unique.push(item);

        }

    });


    searchItems = unique;


    document.getElementById("status").textContent =
        searchItems.length + " results available";


    performSearch();

}


// ======================================================
// SEARCH
// ======================================================

function performSearch() {

    const query =
        searchBox.value
            .toLowerCase()
            .trim();


    let results;


    if (query === "") {

        results = searchItems;

    } else {

        results = searchItems.filter(function(item) {

            return item.name
                .toLowerCase()
                .includes(query);

        });

    }


    renderResults(results);

}


// ======================================================
// SHOW RESULTS
// ======================================================

function renderResults(results) {

    const container =
        document.getElementById("results");

    container.innerHTML = "";


    if (!results || results.length === 0) {

        container.innerHTML =
            '<div class="noResults">No results found.</div>';

        return;

    }


    results.forEach(function(item) {

        const result =
            document.createElement("div");

        result.className = "result";


        const name =
            document.createElement("div");

        name.className = "resultName";

        name.textContent = item.name;


        const type =
            document.createElement("div");

        type.className = "resultType";

        type.textContent = item.type;


        result.appendChild(name);

        result.appendChild(type);


        result.addEventListener(
            "click",
            function() {

                openResult(item);

            }
        );


        container.appendChild(result);

    });

}


// ======================================================
// OPEN RESULT
// ======================================================

function openResult(item) {

    /*
        Apps have normal URLs.
    */

    if (item.type === "App" && item.url) {

        window.location.href = item.url;

        return;

    }


    /*
        If the game has a URL, open it.
    */

    if (item.url) {

        window.location.href = item.url;

        return;

    }


    /*
        If we don't know the game's URL,
        send the user to the games section.
    */

    window.location.href =
        "index.html#games";

}


// ======================================================
// LIVE SEARCH
// ======================================================

searchBox.addEventListener(
    "input",
    function() {

        /*
            Update the URL while searching.

            Example:

            search.html?q=minecraft
        */

        const value =
            searchBox.value.trim();


        if (value !== "") {

            history.replaceState(
                null,
                "",
                "search.html?q=" +
                encodeURIComponent(value)
            );

        } else {

            history.replaceState(
                null,
                "",
                "search.html"
            );

        }


        performSearch();

    }
);


// ======================================================
// ENTER
// ======================================================

searchBox.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            performSearch();

        }

    }
);


// ======================================================
// START
// ======================================================

loadGamesFromMainPage();

</script>

</body>
</html>
