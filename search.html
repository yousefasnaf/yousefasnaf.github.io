<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search - josephasn.com</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: "Courier New", monospace;
}

#page {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px;
}

.back {
    display: inline-block;
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 8px 14px;
    margin-bottom: 25px;
}

.back:hover {
    background: white;
    color: black;
}

h1 {
    text-align: center;
}

#searchBox {
    width: 100%;
    height: 55px;
    padding: 12px 15px;

    background: black;
    color: white;

    border: 2px solid white;
    outline: none;

    font-family: "Courier New", monospace;
    font-size: 18px;
}

#status {
    text-align: center;
    color: #aaa;
    margin: 20px;
}

#results {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.result {
    width: 100%;
    padding: 15px;

    background: #1b1b1b;
    color: white;

    border: 1px solid #444;

    cursor: pointer;

    font-family: "Courier New", monospace;
    text-align: left;

    transition: 0.15s;
}

.result:hover {
    background: #292929;
    border-color: white;
}

.resultName {
    font-size: 18px;
    font-weight: bold;
}

.resultType {
    margin-top: 4px;
    color: #888;
    font-size: 13px;
}

.noResults {
    text-align: center;
    padding: 40px;
    color: #888;
}

</style>

</head>

<body>

<div id="page">

    <a href="index.html" class="back">
        ← HOME
    </a>

    <h1>SEARCH</h1>

    <input
        id="searchBox"
        type="text"
        placeholder="Search anything..."
        autocomplete="off"
    >

    <div id="status">
        Loading games...
    </div>

    <div id="results"></div>

</div>


<!-- UGS GAME CATALOG -->
<script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>


<script>

let searchItems = [];


/* ==================================================
   ADD SEARCH ITEM
================================================== */

function addSearchButton(name, type, action) {

    if (!name) return;

    name = name.trim();

    if (!name) return;

    const exists = searchItems.some(function(item) {

        return (
            item.name.toLowerCase() === name.toLowerCase() &&
            item.type === type
        );

    });

    if (exists) return;

    searchItems.push({
        name: name,
        type: type,
        action: action
    });

}


/* ==================================================
   OPEN GAME IN ABOUT:BLANK
================================================== */

function openGameBlank(gameURL) {

    // Open about:blank immediately from the button click
    const blankWindow = window.open("about:blank", "_blank");

    if (!blankWindow) {
        alert(
            "Your browser blocked the new tab. " +
            "Please allow pop-ups for josephasn.com."
        );
        return;
    }

    // Show a loading message while we get the game
    blankWindow.document.open();
    blankWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Loading Game...</title>
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    background: black;
                    color: white;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-family: Arial, sans-serif;
                }
            </style>
        </head>
        <body>
            Loading game...
        </body>
        </html>
    `);
    blankWindow.document.close();


    // Get the REAL HTML code of the game
    fetch(gameURL)
        .then(function(response) {

            if (!response.ok) {
                throw new Error(
                    "Game returned HTTP " + response.status
                );
            }

            return response.text();

        })

        .then(function(html) {

            /*
                The game may use relative files like:

                ./game.js
                images/player.png
                style.css

                Since we're running it from about:blank,
                we add a <base> tag so those files still
                load from the game's original location.
            */

            const gameDirectory =
                gameURL.substring(
                    0,
                    gameURL.lastIndexOf("/") + 1
                );


            const baseTag =
                '<base href="' +
                gameDirectory.replace(/"/g, "&quot;") +
                '">';


            /*
                Put the base tag inside <head>.
            */

            if (
                html.toLowerCase().includes("<head>")
            ) {

                html = html.replace(
                    /<head>/i,
                    "<head>" + baseTag
                );

            } else {

                html =
                    "<head>" +
                    baseTag +
                    "</head>" +
                    html;

            }


            /*
                THIS IS THE IMPORTANT PART.

                The fetched HTML is written directly
                into the about:blank document.

                It is NOT displayed as text.

                The browser parses it as a real HTML page,
                so its <script>, <style>, <canvas>, etc.
                actually run.
            */

            blankWindow.document.open();

            blankWindow.document.write(html);

            blankWindow.document.close();

        })

        .catch(function(error) {

            console.error(
                "Could not load game:",
                error
            );


            blankWindow.document.open();

            blankWindow.document.write(`
                <!DOCTYPE html>

                <html>

                <head>
                    <title>Game Error</title>
                </head>

                <body style="
                    margin:0;
                    background:#111;
                    color:white;
                    font-family:monospace;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    height:100vh;
                    text-align:center;
                ">

                    <div>
                        <h2>Could not load game</h2>
                        <p>${String(error.message)
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;")}</p>
                    </div>

                </body>

                </html>
            `);

            blankWindow.document.close();

        });

}


/* ==================================================
   YOUTUBE
================================================== */

addSearchButton(
    "YouTube",
    "App",
    function() {

        window.location.href =
            "apps/ty.html";

    }
);


/* ==================================================
   SCRATCH
================================================== */

addSearchButton(
    "Scratch",
    "App",
    function() {

        window.location.href =
            "apps/scrattch.html";

    }
);


/* ==================================================
   UGS GAMES
================================================== */

function loadUGSGames() {

    if (typeof files === "undefined") {

        document.getElementById("status").textContent =
            "Could not load games.";

        console.error(
            "UGS files array was not found."
        );

        return;

    }


    console.log(
        "UGS games found:",
        files.length
    );


    files.forEach(function(file) {

        if (!file) return;


        /*
            Remove the UGS "cl" prefix.
        */

        let gameName = file;

        if (gameName.startsWith("cl")) {
            gameName = gameName.substring(2);
        }


        gameName = gameName.trim();

        if (!gameName) return;


        /*
            Create the search result.
        */

        addSearchButton(

            gameName,

            "Game",

            function() {

                /*
                    REAL UGS GAME URL
                */

                const gameURL =
                    "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/" +
                    encodeURIComponent(file) +
                    ".html";


                /*
                    OPEN IT INSIDE ABOUT:BLANK
                */

                openGameBlank(gameURL);

            }

        );

    });


    document.getElementById("status").textContent =
        searchItems.length +
        " things available";


    performSearch();

}


/* ==================================================
   SEARCH
================================================== */

function performSearch() {

    const searchBox =
        document.getElementById("searchBox");


    const query =
        searchBox.value
            .toLowerCase()
            .trim();


    let results;


    if (query === "") {

        results = searchItems;

    } else {

        results =
            searchItems.filter(function(item) {

                return item.name
                    .toLowerCase()
                    .includes(query);

            });

    }


    renderResults(results);

}


/* ==================================================
   CREATE RESULT BUTTONS
================================================== */

function renderResults(results) {

    const container =
        document.getElementById("results");


    container.innerHTML = "";


    if (
        !results ||
        results.length === 0
    ) {

        container.innerHTML =
            '<div class="noResults">' +
            'No results found.' +
            '</div>';

        return;

    }


    results.forEach(function(item) {


        const button =
            document.createElement("button");


        button.className =
            "result";


        const name =
            document.createElement("div");


        name.className =
            "resultName";


        name.textContent =
            item.name;


        const type =
            document.createElement("div");


        type.className =
            "resultType";


        type.textContent =
            item.type;


        button.appendChild(name);

        button.appendChild(type);


        button.addEventListener(
            "click",
            function() {

                item.action();

            }
        );


        container.appendChild(button);

    });

}


/* ==================================================
   LIVE SEARCH
================================================== */

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        function() {

            const value =
                this.value.trim();


            if (value !== "") {

                history.replaceState(
                    null,
                    "",
                    "search.html?q=" +
                    encodeURIComponent(value)
                );

            } else {

                history.replaceState(
                    null,
                    "",
                    "search.html"
                );

            }


            performSearch();

        }
    );


/* ==================================================
   ENTER
================================================== */

document
    .getElementById("searchBox")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {

                performSearch();

            }

        }
    );


/* ==================================================
   READ ?q=
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const startingQuery =
    params.get("q");


if (startingQuery !== null) {

    document.getElementById(
        "searchBox"
    ).value = startingQuery;

}


/* ==================================================
   START
================================================== */

loadUGSGames();

</script>

</body>
</html>
