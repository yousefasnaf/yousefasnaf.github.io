<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search - josephasn.com</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: "Courier New", monospace;
}

#page {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px;
}

.back {
    display: inline-block;
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 8px 14px;
    margin-bottom: 25px;
}

.back:hover {
    background: white;
    color: black;
}

h1 {
    text-align: center;
}

#searchBox {
    width: 100%;
    height: 55px;
    padding: 12px 15px;

    background: black;
    color: white;

    border: 2px solid white;
    outline: none;

    font-family: "Courier New", monospace;
    font-size: 18px;
}

#status {
    text-align: center;
    color: #aaa;
    margin: 20px;
}

#results {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.result {
    width: 100%;
    padding: 15px;

    background: #1b1b1b;
    color: white;

    border: 1px solid #444;

    cursor: pointer;

    font-family: "Courier New", monospace;
    text-align: left;

    transition: 0.15s;
}

.result:hover {
    background: #292929;
    border-color: white;
}

.resultName {
    font-size: 18px;
    font-weight: bold;
}

.resultType {
    margin-top: 4px;
    color: #888;
    font-size: 13px;
}

.noResults {
    text-align: center;
    padding: 40px;
    color: #888;
}


/*
==================================================
HIDDEN HOMEPAGE
==================================================
*/

#hiddenFrame {
    position: fixed;

    left: -10000px;
    top: -10000px;

    width: 1200px;
    height: 1000px;

    border: 0;
}

</style>

</head>

<body>


<div id="page">

    <a href="index.html" class="back">
        ← HOME
    </a>

    <h1>SEARCH</h1>

    <input
        id="searchBox"
        type="text"
        placeholder="Search anything..."
        autocomplete="off"
    >

    <div id="status">
        Loading games...
    </div>

    <div id="results"></div>

</div>


<!--
    This loads your REAL homepage.

    games.js will run exactly like it does
    on your normal website.
-->

<iframe
    id="hiddenFrame"
    src="index.html">
</iframe>


<script>


// ==================================================
// SEARCH DATA
// ==================================================

let searchItems = [];


// ==================================================
// ADD BUTTON
// ==================================================

function addSearchButton(name, type, clickFunction) {

    if (!name) return;

    name = name.trim();

    if (!name) return;


    // Don't add duplicates

    const exists = searchItems.some(function(item) {

        return (
            item.name.toLowerCase() === name.toLowerCase()
            &&
            item.type === type
        );

    });


    if (exists) return;


    searchItems.push({

        name: name,

        type: type,

        action: clickFunction

    });

}


// ==================================================
// YOUTUBE
// ==================================================

addSearchButton(

    "YouTube",

    "App",

    function() {

        window.location.href =
            "apps/ty.html";

    }

);


// ==================================================
// SCRATCH
// ==================================================

addSearchButton(

    "Scratch",

    "App",

    function() {

        window.location.href =
            "apps/scrattch.html";

    }

);


// ==================================================
// GET ALL GAMES FROM HOMEPAGE
// ==================================================

function getGames() {


    const iframe =
        document.getElementById("hiddenFrame");


    const iframeWindow =
        iframe.contentWindow;


    const iframeDocument =
        iframe.contentDocument ||
        iframeWindow.document;


    if (!iframeDocument) {

        return;

    }


    /*
        Find EVERY UGS game button.
    */

    const gameButtons =
        iframeDocument.querySelectorAll(
            ".ugs-btn"
        );


    console.log(
        "Games found:",
        gameButtons.length
    );


    gameButtons.forEach(function(originalButton) {


        const gameName =
            originalButton.textContent.trim();


        if (!gameName) return;


        /*
            Create our own search button.

            When clicked, it clicks the
            ORIGINAL game button inside
            the hidden homepage.
        */

        addSearchButton(

            gameName,

            "Game",

            function() {

                originalButton.click();

            }

        );

    });


    document.getElementById(
        "status"
    ).textContent =
        searchItems.length +
        " things available";


    performSearch();

}


// ==================================================
// WAIT FOR GAMES
// ==================================================

let attempts = 0;


function waitForGames() {


    attempts++;


    const iframe =
        document.getElementById(
            "hiddenFrame"
        );


    let doc;


    try {

        doc =
            iframe.contentDocument ||
            iframe.contentWindow.document;

    } catch (error) {

        console.error(error);

        return;

    }


    const buttons =
        doc.querySelectorAll(
            ".ugs-btn"
        );


    /*
        If games haven't loaded yet,
        try again.
    */

    if (
        buttons.length === 0
        &&
        attempts < 30
    ) {

        setTimeout(
            waitForGames,
            1000
        );

        return;

    }


    getGames();

}


// ==================================================
// IFRAME LOADED
// ==================================================

document
    .getElementById("hiddenFrame")
    .addEventListener(
        "load",
        function() {

            /*
                Give games.js time to create
                all the games.
            */

            setTimeout(
                waitForGames,
                1000
            );

        }
    );


// ==================================================
// SEARCH
// ==================================================

function performSearch() {


    const query =
        document
            .getElementById("searchBox")
            .value
            .toLowerCase()
            .trim();


    let results;


    if (query === "") {

        results =
            searchItems;

    } else {

        /*
            THIS is what makes partial searching work.

            car

            can find:

            Cars
            Cartoon
            Racing Car
            Car Game
        */

        results =
            searchItems.filter(
                function(item) {

                    return item.name
                        .toLowerCase()
                        .includes(query);

                }
            );

    }


    renderResults(results);

}


// ==================================================
// CREATE SEARCH BUTTONS
// ==================================================

function renderResults(results) {


    const container =
        document.getElementById(
            "results"
        );


    container.innerHTML = "";


    if (
        !results ||
        results.length === 0
    ) {

        container.innerHTML =
            '<div class="noResults">' +
            'No results found.' +
            '</div>';

        return;

    }


    results.forEach(
        function(item) {


            /*
                THIS is the exact same type
                of button for every result.
            */

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "result";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "resultName";


            name.textContent =
                item.name;


            const type =
                document.createElement(
                    "div"
                );


            type.className =
                "resultType";


            type.textContent =
                item.type;


            button.appendChild(name);

            button.appendChild(type);


            button.addEventListener(
                "click",
                function() {

                    item.action();

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


// ==================================================
// LIVE SEARCH
// ==================================================

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        function() {


            const value =
                this.value.trim();


            /*
                Keep ?q= updated.
            */

            if (value !== "") {

                history.replaceState(

                    null,

                    "",

                    "search.html?q=" +
                    encodeURIComponent(
                        value
                    )

                );

            } else {

                history.replaceState(

                    null,

                    "",

                    "search.html"

                );

            }


            performSearch();

        }
    );


// ==================================================
// ENTER
// ==================================================

document
    .getElementById("searchBox")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {

                performSearch();

            }

        }
    );


// ==================================================
// READ ?q=
// ==================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const startingQuery =
    params.get("q");


if (startingQuery !== null) {

    document.getElementById(
        "searchBox"
    ).value = startingQuery;

}

</script>

</body>
</html>
