<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search - josephasn.com</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: "Courier New", monospace;
    min-height: 100vh;
}

#page {
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px;
}

.back {
    display: inline-block;
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 8px 14px;
    margin-bottom: 20px;
}

.back:hover {
    background: white;
    color: black;
}

h1 {
    text-align: center;
}

#searchBox {
    width: 100%;
    padding: 15px;
    font-family: "Courier New", monospace;
    font-size: 18px;
    background: black;
    color: white;
    border: 2px solid white;
    outline: none;
}

#status {
    text-align: center;
    color: #aaa;
    margin: 20px;
}

#results {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.result {
    padding: 15px;
    background: #1b1b1b;
    border: 1px solid #444;
    cursor: pointer;
}

.result:hover {
    background: #292929;
    border-color: white;
}

.name {
    font-size: 18px;
    font-weight: bold;
}

.type {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.noResults {
    text-align: center;
    color: #888;
    padding: 40px;
}


/* ==================================================
   HIDDEN UGS CONTAINER
   games.js needs these elements to exist
   ================================================== */

#ugsArea {
    position: fixed;
    left: -100000px;
    top: -100000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

#sidebar {
    display: none;
}

#ugsMainContent {
    width: 1px;
    height: 1px;
}

#sections-container {
    width: 1px;
    height: 1px;
}
</style>
</head>

<body>

<div id="page">

    <a href="index.html" class="back">← HOME</a>

    <h1>SEARCH</h1>

    <input
        id="searchBox"
        type="text"
        placeholder="Search games, apps, YouTube..."
        autocomplete="off"
    >

    <div id="status">
        Loading games...
    </div>

    <div id="results"></div>

</div>


<!--
======================================================
UGS NEEDS THESE ELEMENTS
======================================================
-->

<div id="ugsArea">

    <div id="sidebar"></div>

    <div id="ugsMainContent">

        <div id="sections-container"></div>

    </div>

</div>


<script>

// =====================================================
// SEARCH DATABASE
// =====================================================

let searchItems = [];


// =====================================================
// ADD ITEM
// =====================================================

function addItem(name, type, action) {

    if (!name) return;

    name = name.trim();

    if (!name) return;

    // Prevent duplicates
    const exists = searchItems.some(function(item) {

        return item.name.toLowerCase() ===
               name.toLowerCase() &&
               item.type === type;

    });

    if (exists) return;

    searchItems.push({
        name: name,
        type: type,
        action: action
    });
}


// =====================================================
// APPS
// =====================================================

addItem(
    "YouTube",
    "App",
    function() {
        window.location.href = "apps/ty.html";
    }
);

addItem(
    "Scratch",
    "App",
    function() {
        window.location.href = "apps/scrattch.html";
    }
);


// =====================================================
// READ ?q=
// =====================================================

const params =
    new URLSearchParams(window.location.search);

const startingQuery =
    params.get("q");

const searchBox =
    document.getElementById("searchBox");

if (startingQuery !== null) {

    searchBox.value = startingQuery;

}


// =====================================================
// FIND GAMES AFTER games.js LOADS
// =====================================================

function collectGames() {

    const container =
        document.getElementById("sections-container");

    if (!container) return;


    const buttons =
        container.querySelectorAll(".ugs-btn");


    console.log(
        "UGS buttons found:",
        buttons.length
    );


    buttons.forEach(function(button) {

        const name =
            button.textContent.trim();

        if (!name) return;


        addItem(
            name,
            "Game",
            function() {

                /*
                    Click the REAL UGS button.

                    This means we don't have to guess
                    the URL of the game.
                */

                button.click();

            }
        );

    });


    document.getElementById("status").textContent =
        searchItems.length + " things available";


    performSearch();

}


// =====================================================
// LOAD UGS games.js
// =====================================================

const ugsScript =
    document.createElement("script");

ugsScript.src =
    "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@latest/games.js";


ugsScript.onload = function() {

    console.log("UGS games.js loaded");


    /*
        games.js builds the buttons after loading,
        so wait a little before collecting them.
    */

    setTimeout(function() {

        collectGames();

    }, 1500);

};


ugsScript.onerror = function() {

    document.getElementById("status").textContent =
        "Failed to load games.";

};


document.body.appendChild(ugsScript);


// =====================================================
// SEARCH
// =====================================================

function performSearch() {

    const query =
        searchBox.value
            .toLowerCase()
            .trim();


    let results;


    if (query === "") {

        results = searchItems;

    } else {

        results =
            searchItems.filter(function(item) {

                return item.name
                    .toLowerCase()
                    .includes(query);

            });

    }


    renderResults(results);

}


// =====================================================
// DISPLAY RESULTS
// =====================================================

function renderResults(results) {

    const resultsBox =
        document.getElementById("results");

    resultsBox.innerHTML = "";


    if (results.length === 0) {

        resultsBox.innerHTML =
            '<div class="noResults">' +
            'No results found.' +
            '</div>';

        return;

    }


    results.forEach(function(item) {

        const result =
            document.createElement("div");

        result.className = "result";


        const name =
            document.createElement("div");

        name.className = "name";

        name.textContent = item.name;


        const type =
            document.createElement("div");

        type.className = "type";

        type.textContent = item.type;


        result.appendChild(name);

        result.appendChild(type);


        result.addEventListener(
            "click",
            function() {

                item.action();

            }
        );


        resultsBox.appendChild(result);

    });

}


// =====================================================
// LIVE SEARCH
// =====================================================

searchBox.addEventListener(
    "input",
    function() {

        const value =
            searchBox.value.trim();


        /*
            Keep ?q= updated.
        */

        if (value !== "") {

            history.replaceState(
                null,
                "",
                "search.html?q=" +
                encodeURIComponent(value)
            );

        } else {

            history.replaceState(
                null,
                "",
                "search.html"
            );

        }


        performSearch();

    }
);


// =====================================================
// ENTER
// =====================================================

searchBox.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {

            performSearch();

        }

    }
);

</script>

</body>
</html>
